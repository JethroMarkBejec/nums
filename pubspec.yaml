name: nums
description: Mobile cookie ordering and inventory management app.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Keep the 1.x in-app preview toolbar; 3.x removes it in favor of DevTools.
  device_preview: ^1.3.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Gaegu
      fonts:
        - asset: assets/fonts/Gaegu-Bold.ttf
          weight: 700
